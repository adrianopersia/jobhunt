[project]
name = "jobhunt"
version = "0.1.0"
description = "Pipeline de agentes para búsqueda laboral: scouting de avisos, CV anclado a evidencia y revisión de postulaciones."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
