# Copiar a private/preferences.yaml y ajustar. Todas las regex son case-insensitive.

# Híbrido o presencial solo si la ubicación menciona alguna de estas palabras.
home_city_keywords: [rosario]
remote_ok: true

# Piso para filtrar (no es la respuesta a "expectativa salarial").
salary_floor_usd_month: 1500
# Unidades de moneda local por 1 USD. Sin tipo de cambio, el piso no se aplica a esa moneda.
fx_to_usd: {}

# Bandas de mercado en USD/mes, bruto, para tu nivel. Con esto `jobhunt salary` recomienda
# cuánto pedir cuando el aviso no publica salario. Citá la fuente y la fecha.
salary_reference:
  local: {min: 1500, max: 2000, source: "encuesta de sueldos local, 2026"}
  foreign: {min: 2500, max: 4000, source: "guía de salarios remotos, 2026"}

max_years_required: 5
excluded_role_families: [ml_research, ml_engineer, data, non_engineering]
apply_threshold: 70
maybe_threshold: 50

remote_region_ok: ['argentin', '\b(latam|latin america|worldwide|anywhere)\b']
remote_region_block: ['\b(united states|usa|canada|europe|uk|india)\b']
priority_title: ['\b(ai|llm)\b', 'agent']
max_new_per_source: 40

title_include:
  - '\b(ai|ia|llm|genai)\b'
  - 'agent'
  - 'automat'
  - 'full[- ]?stack'
  - 'back[- ]?end'
  - 'software (engineer|developer)'
  - '\bdeveloper\b'
title_exclude:
  - '\b(staff|principal|head of|director)\b'
  - 'manager'
  - 'secur'
